name: Verify and release KILN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kiln-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser journey and accessibility (preinstalled Chrome)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          QA_PREFIX: ci
        run: |
          npm run preview > /tmp/kiln-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4178/kiln-atelier/ >/dev/null && break; sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiln-browser-evidence
          path: |
            playwright-report
            test-results
            QA/screenshots/ci-*.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
